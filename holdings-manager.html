<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>股票基金持仓管理</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0F172A;color:#F8FAFC;min-height:100vh;background-image:radial-gradient(ellipse at 20% 0%,rgba(79,70,229,0.15) 0%,transparent 50%),radial-gradient(ellipse at 80% 100%,rgba(6,182,212,0.1) 0%,transparent 50%)}
    .header{background:linear-gradient(135deg,#1E293B,#0F172A);border-bottom:1px solid rgba(255,255,255,0.06);padding:20px 32px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;backdrop-filter:blur(12px)}
    .header-left{display:flex;align-items:center;gap:12px}
    .header-icon{width:40px;height:40px;background:linear-gradient(135deg,#4F46E5,#06B6D4);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px}
    .header h1{font-size:20px;font-weight:700}
    .header p{font-size:12px;color:#64748B}
    .btn-back{padding:8px 16px;background:rgba(79,70,229,0.15);border:1px solid rgba(79,70,229,0.3);border-radius:8px;color:#818CF8;font-size:13px;font-weight:500;cursor:pointer;text-decoration:none;transition:all 0.2s;display:inline-flex;align-items:center;gap:6px}
    .btn-back:hover{background:rgba(79,70,229,0.25)}
    .container{max-width:900px;margin:0 auto;padding:32px 24px}
    .summary-row{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:32px}
    .summary-card{background:rgba(30,41,59,0.7);border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:20px 24px;backdrop-filter:blur(10px);transition:all 0.3s}
    .summary-card:hover{border-color:rgba(79,70,229,0.3);transform:translateY(-2px);box-shadow:0 8px 32px rgba(79,70,229,0.1)}
    .summary-card .label{font-size:12px;color:#64748B;font-weight:500;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:8px}
    .summary-card .value{font-size:26px;font-weight:700}
    .summary-card .sub{font-size:12px;color:#475569;margin-top:4px}
    .summary-card.stock .value{color:#4ade80}
    .summary-card.fund .value{color:#38bdf8}
    .summary-card.total .value{color:#F8FAFC}
    .section-title{font-size:16px;font-weight:600;margin-bottom:16px;display:flex;align-items:center;gap:8px}
    .section-title::before{content:'';width:4px;height:18px;background:linear-gradient(180deg,#4F46E5,#06B6D4);border-radius:2px}
    .form-card{background:rgba(30,41,59,0.7);border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:28px;margin-bottom:32px;backdrop-filter:blur(10px)}
    .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
    .form-group{display:flex;flex-direction:column;gap:6px}
    .form-group.full{grid-column:1/-1}
    .form-label{font-size:12px;color:#94A3B8;font-weight:500}
    .form-input{padding:10px 14px;background:rgba(15,23,42,0.6);border:1px solid rgba(255,255,255,0.08);border-radius:10px;color:#F8FAFC;font-size:14px;font-family:inherit;outline:none;transition:border-color 0.2s}
    .form-input:focus{border-color:#4F46E5}
    .form-input::placeholder{color:#475569}
    .type-toggle{display:flex;gap:8px}
    .type-btn{flex:1;padding:10px;border-radius:10px;border:1px solid rgba(255,255,255,0.08);background:rgba(15,23,42,0.6);color:#64748B;font-size:13px;font-weight:500;cursor:pointer;transition:all 0.2s}
    .type-btn.active-stock{border-color:#4ade80;color:#4ade80;background:rgba(74,222,128,0.1)}
    .type-btn.active-fund{border-color:#38bdf8;color:#38bdf8;background:rgba(56,189,248,0.1)}
    .btn-add{margin-top:16px;width:100%;padding:12px;background:linear-gradient(135deg,#4F46E5,#06B6D4);border:none;border-radius:12px;color:#fff;font-size:14px;font-weight:600;cursor:pointer;transition:all 0.3s;letter-spacing:0.3px}
    .btn-add:hover{opacity:0.9;transform:translateY(-1px);box-shadow:0 8px 24px rgba(79,70,229,0.4)}
    .holdings-card{background:rgba(30,41,59,0.7);border:1px solid rgba(255,255,255,0.06);border-radius:16px;overflow:hidden;backdrop-filter:blur(10px)}
    .holdings-header{padding:20px 24px;border-bottom:1px solid rgba(255,255,255,0.05);display:flex;align-items:center;justify-content:space-between}
    .holdings-header h2{font-size:16px;font-weight:600}
    .holdings-actions{display:flex;gap:8px}
    .btn-refresh{padding:6px 14px;background:rgba(79,70,229,0.15);border:1px solid rgba(79,70,229,0.3);border-radius:8px;color:#818CF8;font-size:12px;font-weight:500;cursor:pointer;transition:all 0.2s;display:flex;align-items:center;gap:4px}
    .btn-refresh:hover{background:rgba(79,70,229,0.25)}
    .btn-refresh.loading{opacity:0.6;pointer-events:none}
    @keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
    .table-wrap{overflow-x:auto}
    table{width:100%;border-collapse:collapse;min-width:600px}
    thead tr{background:rgba(15,23,42,0.4)}
    th{padding:12px 16px;text-align:left;font-size:11px;font-weight:600;color:#64748B;text-transform:uppercase;letter-spacing:0.5px;white-space:nowrap}
    td{padding:14px 16px;font-size:13px;color:#CBD5E1;border-bottom:1px solid rgba(255,255,255,0.03);vertical-align:middle}
    tbody tr:hover{background:rgba(79,70,229,0.05)}
    tbody tr:last-child td{border-bottom:none}
    .type-tag{display:inline-flex;align-items:center;padding:3px 8px;border-radius:6px;font-size:11px;font-weight:600}
    .type-tag.stock{background:rgba(74,222,128,0.12);color:#4ade80}
    .type-tag.fund{background:rgba(56,189,248,0.12);color:#38bdf8}
    .code-cell{font-family:'SF Mono','Fira Code',monospace;font-size:13px;color:#94A3B8}
    .price-up{color:#EF4444}
    .price-down{color:#22C55E}
    .price-flat{color:#64748B}
    .amount-val{font-weight:600;color:#F8FAFC;font-size:13px}
    .action-btns{display:flex;gap:6px}
    .btn-edit,.btn-del{padding:5px 10px;border-radius:6px;border:1px solid rgba(255,255,255,0.08);font-size:11px;font-weight:500;cursor:pointer;transition:all 0.2s}
    .btn-edit{background:rgba(79,70,229,0.12);color:#818CF8}
    .btn-edit:hover{background:rgba(79,70,229,0.25)}
    .btn-del{background:rgba(239,68,68,0.1);color:#F87171}
    .btn-del:hover{background:rgba(239,68,68,0.2)}
    .empty-state{padding:60px 20px;text-align:center}
    .empty-state .emoji{font-size:48px;margin-bottom:16px;opacity:0.6}
    .empty-state h3{font-size:16px;color:#94A3B8;margin-bottom:6px}
    .empty-state p{font-size:13px;color:#475569}
    .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(100px);background:rgba(30,41,59,0.95);border:1px solid rgba(255,255,255,0.1);border-radius:12px;padding:12px 24px;font-size:13px;color:#F8FAFC;z-index:9999;backdrop-filter:blur(12px);transition:transform 0.3s;pointer-events:none;display:flex;align-items:center;gap:8px}
    .toast.show{transform:translateX(-50%) translateY(0)}
    .toast.success{border-color:rgba(34,197,94,0.4)}
    .toast.error{border-color:rgba(239,68,68,0.4)}
    .toast.info{border-color:rgba(79,70,229,0.4)}
    .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:1000;display:none;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
    .modal-overlay.show{display:flex}
    .modal{background:#1E293B;border:1px solid rgba(255,255,255,0.08);border-radius:16px;padding:28px;width:420px;max-width:90vw}
    .modal h3{font-size:16px;margin-bottom:20px}
    .modal-actions{display:flex;gap:10px;margin-top:20px}
    .modal-actions button{flex:1;padding:10px;border-radius:10px;border:none;font-size:13px;font-weight:600;cursor:pointer;transition:all 0.2s}
    .btn-cancel{background:rgba(255,255,255,0.06);color:#94A3B8}
    .btn-cancel:hover{background:rgba(255,255,255,0.1)}
    .btn-confirm{background:linear-gradient(135deg,#4F46E5,#06B6D4);color:#fff}
    .btn-confirm:hover{opacity:0.9}
    .btn-confirm.danger{background:linear-gradient(135deg,#EF4444,#F97316)}
    .footer{text-align:center;padding:32px 24px;font-size:12px;color:#334155}
    .last-updated{font-size:11px;color:#334155;margin-top:4px}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}
    .updating-dot{display:inline-block;width:6px;height:6px;background:#22C55E;border-radius:50%;margin-right:4px;animation:pulse 2s infinite}
    @media(max-width:768px){.summary-row{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.header{padding:16px 20px}.container{padding:20px 16px}.header h1{font-size:16px}}
  </style>
</head>
<body>
  <div class="header">
    <div class="header-left">
      <div class="header-icon">📊</div>
      <div>
        <h1>股票基金持仓管理</h1>
        <p>持仓录入 &bull; 实时行情 &bull; localStorage 持久化</p>
      </div>
    </div>
    <div class="header-right">
      <a href="personal-asset-dashboard.html" class="btn-back">← 回到总览</a>
    </div>
  </div>

  <div class="container">
    <!-- 汇总卡片 -->
    <div class="summary-row">
      <div class="summary-card stock">
        <div class="label">股票总市值</div>
        <div class="value" id="stockTotal">¥0.00</div>
        <div class="sub" id="stockCount">共 0 只</div>
      </div>
      <div class="summary-card fund">
        <div class="label">基金总市值</div>
        <div class="value" id="fundTotal">¥0.00</div>
        <div class="sub" id="fundCount">共 0 只</div>
      </div>
      <div class="summary-card total">
        <div class="label">证券总资产</div>
        <div class="value" id="grandTotal">¥0.00</div>
        <div class="last-updated" id="lastUpdated"><span class="updating-dot"></span>东方财富实时行情</div>
      </div>
    </div>

    <!-- 添加表单 -->
    <div class="section-title">添加 / 编辑持仓</div>
    <div class="form-card">
      <div class="form-grid">
        <div class="form-group">
          <label class="form-label">持仓类型</label>
          <div class="type-toggle">
            <button class="type-btn active-stock" id="btnStock" onclick="setType('stock')">📈 股票</button>
            <button class="type-btn" id="btnFund" onclick="setType('fund')">📉 基金</button>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label" id="codeLabel">股票代码（6位）</label>
          <input type="text" class="form-input" id="codeInput" placeholder="如：600519" maxlength="6" />
        </div>
        <div class="form-group">
          <label class="form-label">持有份数（股数/份额）</label>
          <input type="number" class="form-input" id="sharesInput" placeholder="如：100" min="1" />
        </div>
        <div class="form-group">
          <label class="form-label">备注（可选）</label>
          <input type="text" class="form-input" id="noteInput" placeholder="如：A股主板" />
        </div>
        <div class="form-group full">
          <input type="hidden" id="editIndex" value="-1" />
          <button class="btn-add" id="addBtn" onclick="handleAddOrUpdate()">+ 添加持仓</button>
        </div>
      </div>
    </div>

    <!-- 持仓列表 -->
    <div class="section-title">持仓明细</div>
    <div class="holdings-card">
      <div class="holdings-header">
        <h2>📋 持仓列表</h2>
        <div class="holdings-actions">
          <button class="btn-refresh" id="refreshBtn" onclick="refreshPrices()">🔄 刷新价格</button>
        </div>
      </div>
      <div class="table-wrap">
        <table id="holdingsTable">
          <thead>
            <tr>
              <th>类型</th><th>代码</th><th>名称</th><th>最新价</th><th>涨跌幅</th><th>份数</th><th>市值</th><th>备注</th><th>操作</th>
            </tr>
          </thead>
          <tbody id="holdingsBody"></tbody>
        </table>
      </div>
      <div class="empty-state" id="emptyState" style="display:none">
        <div class="emoji">📭</div>
        <h3>暂无持仓</h3>
        <p>在上方添加你的第一只股票或基金</p>
      </div>
    </div>
  </div>

  <!-- 删除确认弹窗 -->
  <div class="modal-overlay" id="deleteModal">
    <div class="modal">
      <h3>确认删除</h3>
      <p style="font-size:13px;color:#94A3B8;margin-bottom:8px">确定删除 <strong id="delName" style="color:#F8FAFC"></strong> 吗？</p>
      <p style="font-size:12px;color:#475569">此操作不可撤销。</p>
      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeDeleteModal()">取消</button>
        <button class="btn-confirm danger" onclick="confirmDelete()">确认删除</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <div class="footer">数据来源：东方财富 &bull; 行情仅供参考 &bull; 实际交易请以交易所为准</div>

<script>
// ─── State ─────────────────────────────────────────────────
const STORAGE_KEY = 'assetHoldings';
let currentType = 'stock';
let holdings = [];
let deleteTargetIndex = -1;

// ─── Init ───────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  loadFromStorage();
  renderTable();
  updateSummary();
  refreshPrices();
  document.getElementById('codeInput').addEventListener('input', e => { e.target.value = e.target.value.replace(/\D/g,''); });
  document.getElementById('sharesInput').addEventListener('input', e => { e.target.value = e.target.value.replace(/\D/g,''); });
});

// ─── Storage ────────────────────────────────────────────────
function loadFromStorage() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    holdings = raw ? JSON.parse(raw) : [];
  } catch(e) { holdings = []; }
}
function saveToStorage() { localStorage.setItem(STORAGE_KEY, JSON.stringify(holdings)); }

// ─── Type Toggle ────────────────────────────────────────────
function setType(type) {
  currentType = type;
  document.getElementById('btnStock').className = 'type-btn' + (type==='stock'?' active-stock':'');
  document.getElementById('btnFund').className = 'type-btn' + (type==='fund'?' active-fund':'');
  document.getElementById('codeLabel').textContent = type==='stock' ? '股票代码（6位）' : '基金代码（5-6位）';
  document.getElementById('codeInput').placeholder = type==='stock' ? '如：600519' : '如：110022';
}

// ─── Add / Update ───────────────────────────────────────────
function handleAddOrUpdate() {
  const editIdx = parseInt(document.getElementById('editIndex').value);
  const code = document.getElementById('codeInput').value.trim();
  const shares = parseInt(document.getElementById('sharesInput').value);
  const note = document.getElementById('noteInput').value.trim();

  if (!code || code.length < 5) { showToast('请输入至少5位代码', 'error'); return; }
  if (!shares || shares <= 0) { showToast('请输入有效份数', 'error'); return; }

  if (editIdx >= 0) {
    holdings[editIdx] = { ...holdings[editIdx], code, shares, qty: shares, note, type: currentType, price: 0, changePct: 0, name: code };
    showToast('持仓已更新', 'success');
  } else {
    if (holdings.find(h => h.code === code && h.type === currentType)) { showToast('该持仓已存在', 'error'); return; }
    holdings.push({ type: currentType, code, name: code, price: 0, changePct: 0, shares, qty: shares, note, lastFetched: null });
    showToast('添加成功，正在获取行情…', 'info');
  }
  saveToStorage();
  renderTable();
  updateSummary();
  resetForm();
  fetchPricesForAll();
}

// ─── Reset Form ─────────────────────────────────────────────
function resetForm() {
  document.getElementById('codeInput').value = '';
  document.getElementById('sharesInput').value = '';
  document.getElementById('noteInput').value = '';
  document.getElementById('editIndex').value = -1;
  document.getElementById('addBtn').textContent = '+ 添加持仓';
}

// ─── Edit ───────────────────────────────────────────────────
function editHolding(index) {
  const h = holdings[index];
  setType(h.type);
  document.getElementById('codeInput').value = h.code;
  document.getElementById('sharesInput').value = h.shares;
  document.getElementById('noteInput').value = h.note || '';
  document.getElementById('editIndex').value = index;
  document.getElementById('addBtn').textContent = '✓ 更新持仓';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ─── Delete ─────────────────────────────────────────────────
function showDeleteModal(index) {
  deleteTargetIndex = index;
  document.getElementById('delName').textContent = holdings[index].name + ' (' + holdings[index].code + ')';
  document.getElementById('deleteModal').classList.add('show');
}
function closeDeleteModal() {
  document.getElementById('deleteModal').classList.remove('show');
  deleteTargetIndex = -1;
}
function confirmDelete() {
  if (deleteTargetIndex >= 0) {
    holdings.splice(deleteTargetIndex, 1);
    saveToStorage();
    renderTable();
    updateSummary();
    showToast('已删除', 'success');
  }
  closeDeleteModal();
}

// ─── Fetch Prices (东方财富) ────────────────────────────────
async function fetchPricesForAll() {
  if (!holdings.length) return;
  const needsFetch = holdings.filter(h => !h.price);
  if (!needsFetch.length) return;
  const btn = document.getElementById('refreshBtn');
  btn.classList.add('loading'); btn.textContent = '⏳ 刷新中…';

  for (const item of needsFetch) {
    await fetchSinglePrice(item);
    await new Promise(r => setTimeout(r, 200)); // 限速
  }
  saveToStorage();
  renderTable();
  updateSummary();
  btn.classList.remove('loading'); btn.textContent = '🔄 刷新价格';
  const now = new Date().toLocaleTimeString('zh-CN');
  document.getElementById('lastUpdated').innerHTML = '<span class="updating-dot"></span>更新于 ' + now;
}

async function fetchSinglePrice(item) {
  try {
    // 东方财富行情接口
    const url = `https://push2.eastmoney.com/api/qt/stock/get?secid=${item.type==='stock'?'1':'2'}.${item.code}&fields=f43,f57,f58,f107,f169,f170&cb=cb`;
    const resp = await fetch(url);
    const text = await resp.text();
    const match = text.match(/cb\((.*)\)/);
    if (!match) return;
    const data = JSON.parse(match[1]);
    if (!data.data) return;
    const d = data.data;
    item.price = (d.f43 || 0) / 100;        // 最新价（分转元）
    item.changePct = (d.f170 || 0) / 100; // 涨跌幅（%）
    item.name = d.f58 || item.code;       // 名称
  } catch(e) {
    // 静默失败，价格保持为0
  }
}

// Alias
function refreshPrices() { fetchPricesForAll(); }

// ─── Render Table ───────────────────────────────────────────
function renderTable() {
  const tbody = document.getElementById('holdingsBody');
  const empty = document.getElementById('emptyState');

  if (!holdings.length) {
    tbody.innerHTML = '';
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';

  tbody.innerHTML = holdings.map((h, i) => {
    const isUp = h.changePct > 0;
    const isDown = h.changePct < 0;
    const priceClass = isUp ? 'price-up' : isDown ? 'price-down' : 'price-flat';
    const changeClass = isUp ? 'change-pos' : isDown ? 'change-neg' : 'price-flat';
    const marketVal = h.price > 0 ? h.price * h.shares : 0;
    const priceStr = h.price > 0 ? '¥' + h.price.toFixed(2) : '<span style="color:#475569">加载中…</span>';
    const pctStr = h.changePct !== 0 ? (isUp ? '+' : '') + h.changePct.toFixed(2) + '%' : '—';
    const valStr = marketVal > 0 ? '¥' + formatNum(marketVal) : '—';
    const typeLabel = h.type === 'stock' ? '股票' : '基金';
    return `<tr>
      <td><span class="type-tag ${h.type}">${typeLabel}</span></td>
      <td class="code-cell">${h.code}</td>
      <td style="font-weight:500;color:#F8FAFC">${h.name || h.code}</td>
      <td class="${priceClass}">${priceStr}</td>
      <td class="${changeClass}">${pctStr}</td>
      <td>${h.shares.toLocaleString()}</td>
      <td class="amount-val">${valStr}</td>
      <td style="color:#64748B;font-size:12px">${h.note || '—'}</td>
      <td><div class="action-btns">
        <button class="btn-edit" onclick="editHolding(${i})">✏️</button>
        <button class="btn-del" onclick="showDeleteModal(${i})">🗑️</button>
      </div></td>
    </tr>`;
  }).join('');
}

// ─── Update Summary ─────────────────────────────────────────
function updateSummary() {
  let stockVal = 0, stockCnt = 0, fundVal = 0, fundCnt = 0;
  holdings.forEach(h => {
    const val = h.price > 0 ? h.price * h.shares : 0;
    if (h.type === 'stock') { stockVal += val; stockCnt++; }
    else { fundVal += val; fundCnt++; }
  });
  document.getElementById('stockTotal').textContent = '¥' + formatNum(stockVal);
  document.getElementById('fundTotal').textContent = '¥' + formatNum(fundVal);
  document.getElementById('grandTotal').textContent = '¥' + formatNum(stockVal + fundVal);
  document.getElementById('stockCount').textContent = '共 ' + stockCnt + ' 只';
  document.getElementById('fundCount').textContent = '共 ' + fundCnt + ' 只';
}

function formatNum(n) {
  if (n >= 10000) return (n/10000).toFixed(2) + '万';
  return n.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
}

// ─── Toast ──────────────────────────────────────────────────
function showToast(msg, type='info') {
  const t = document.getElementById('toast');
  const icons = { success: '✅', error: '❌', info: '💡' };
  t.className = 'toast ' + type;
  t.innerHTML = (icons[type] || '💡') + ' ' + msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}
</script>
</body>
</html>
