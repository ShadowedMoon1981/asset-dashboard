<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>个人资产管理看板</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --bg:        #0b0f1a;
      --surface:  #111827;
      --card:     #1a2236;
      --card2:    #1e2a3a;
      --border:   #2a3a52;
      --border2:  #374563;
      --text:     #e8edf5;
      --text2:    #8fa3bf;
      --text3:    #566480;
      --blue:     #4f8ef7;
      --purple:   #a78bfa;
      --green:    #34d399;
      --yellow:   #fbbf24;
      --red:      #f87171;
      --orange:   #fb923c;
      --pink:     #f472b6;
      --cyan:     #22d3ee;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── Hero ── */
    .hero {
      background: linear-gradient(135deg, #1a1f3a 0%, #0f172a 40%, #1a0a2e 100%);
      border-bottom: 1px solid var(--border);
      padding: 28px 24px 32px;
      position: relative;
      overflow: hidden;
    }
    .hero::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 60% 80% at 20% 50%, rgba(79,70,229,0.12) 0%, transparent 70%),
        radial-gradient(ellipse 50% 60% at 80% 30%, rgba(59,130,246,0.1) 0%, transparent 70%);
      pointer-events: none;
    }
    .hero-inner { max-width: 1200px; margin: 0 auto; position: relative; z-index: 1; }

    .hero-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }
    .hero-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--text2);
      letter-spacing: 0.5px;
    }
    .hero-refresh {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      background: rgba(255,255,255,0.06);
      border: 1px solid var(--border);
      border-radius: 20px;
      color: var(--text2);
      font-size: 12px;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s;
    }
    .hero-refresh:hover { background: rgba(255,255,255,0.1); color: var(--text); }

    .hero-main {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
      flex-wrap: wrap;
    }
    .hero-total-block {}
    .hero-label {
      font-size: 13px;
      color: var(--text3);
      margin-bottom: 6px;
    }
    .hero-amount {
      font-size: 3.2rem;
      font-weight: 800;
      color: #fff;
      letter-spacing: -1px;
      line-height: 1;
    }
    .hero-sub {
      font-size: 12px;
      color: var(--text3);
      margin-top: 8px;
    }
    .hero-sub span { color: var(--green); }

    .hero-cards {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: flex-end;
    }
    .hero-card {
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 16px;
      min-width: 110px;
      text-align: center;
      transition: all 0.2s;
    }
    .hero-card:hover { background: rgba(255,255,255,0.08); border-color: var(--border2); }
    .hero-card-icon { font-size: 1.5rem; margin-bottom: 4px; }
    .hero-card-name { font-size: 11px; color: var(--text3); margin-bottom: 3px; }
    .hero-card-val { font-size: 1rem; font-weight: 700; color: var(--text); }
    .hero-card-pct { font-size: 10px; color: var(--text3); margin-top: 2px; }

    /* ── Body ── */
    .body { max-width: 1200px; margin: 0 auto; padding: 24px 20px 40px; }

    /* ── Section ── */
    .section { margin-bottom: 32px; }
    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .section-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text2);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .section-title::before {
      content: '';
      width: 3px;
      height: 16px;
      background: linear-gradient(to bottom, var(--blue), var(--purple));
      border-radius: 2px;
    }
    .section-note { font-size: 12px; color: var(--text3); }

    /* ── Cards Grid ── */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 10px;
      margin-bottom: 18px;
    }
    .asset-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      transition: all 0.25s;
      cursor: default;
      position: relative;
      overflow: hidden;
    }
    .asset-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      border-radius: 14px 14px 0 0;
    }
    .asset-card:hover { border-color: var(--border2); transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.3); }

    .asset-card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .asset-card-icon { font-size: 1.6rem; }
    .asset-card-pct {
      font-size: 11px;
      background: rgba(255,255,255,0.07);
      border-radius: 6px;
      padding: 2px 7px;
      color: var(--text2);
    }
    .asset-card-name { font-size: 12px; color: var(--text3); margin-bottom: 4px; }
    .asset-card-val { font-size: 1.15rem; font-weight: 700; }
    .asset-card-bar {
      margin-top: 10px;
      height: 4px;
      background: rgba(255,255,255,0.07);
      border-radius: 4px;
      overflow: hidden;
    }
    .asset-card-bar-fill { height: 100%; border-radius: 4px; }

    /* ── Charts Row ── */
    .charts-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }
    .chart-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px;
    }
    .chart-card-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text2);
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .chart-wrap { position: relative; height: 220px; }

    /* ── Footer ── */
    .footer {
      text-align: center;
      padding: 24px 20px;
      color: var(--text3);
      font-size: 12px;
      border-top: 1px solid var(--border);
      margin-top: 20px;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .hero-amount { font-size: 2.4rem; }
      .hero-cards { display: none; }
      .charts-row { grid-template-columns: 1fr; }
      .cards-grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 480px) {
      .cards-grid { grid-template-columns: 1fr 1fr; gap: 8px; }
      .hero-amount { font-size: 2rem; }
    }
  </style>
</head>
<body>

<!-- Hero -->
<div class="hero">
  <div class="hero-inner">
    <div class="hero-top">
      <div class="hero-title">💰 我的资产</div>
      <a href="holdings-manager.html" class="hero-refresh">📊 持仓管理</a>
    </div>
    <div class="hero-main">
      <div class="hero-total-block">
        <div class="hero-label">总资产（人民币）</div>
        <div class="hero-amount" id="totalAmount">¥ 0.00</div>
        <div class="hero-sub">数据来源：东方财富 · <span id="updateDate">--</span></div>
      </div>
      <div class="hero-cards" id="heroCards"></div>
    </div>
  </div>
</div>

<!-- Body -->
<div class="body">

  <!-- 按平台 -->
  <div class="section">
    <div class="section-header">
      <div class="section-title">按平台</div>
      <div class="section-note">各账户独立统计</div>
    </div>
    <div class="cards-grid" id="platformCards"></div>
    <div class="charts-row">
      <div class="chart-card">
        <div class="chart-card-title">📊 平台分布</div>
        <div class="chart-wrap"><canvas id="platformPieChart"></canvas></div>
      </div>
      <div class="chart-card">
        <div class="chart-card-title">📈 平台对比</div>
        <div class="chart-wrap"><canvas id="platformBarChart"></canvas></div>
      </div>
    </div>
  </div>

  <!-- 按类型 -->
  <div class="section">
    <div class="section-header">
      <div class="section-title">按类型</div>
      <div class="section-note">按资产类别汇总</div>
    </div>
    <div class="cards-grid" id="typeCards"></div>
    <div class="charts-row">
      <div class="chart-card">
        <div class="chart-card-title">🍩 类型分布</div>
        <div class="chart-wrap"><canvas id="typePieChart"></canvas></div>
      </div>
      <div class="chart-card">
        <div class="chart-card-title">📊 类型对比</div>
        <div class="chart-wrap"><canvas id="typeBarChart"></canvas></div>
      </div>
    </div>
  </div>

</div>

<!-- Footer -->
<div class="footer">
  📌 股票/基金数据来源：东方财富 · 手动输入金额后自动计算
</div>

<script>
// ── Config ──────────────────────────────────────────────
const PLATFORM_ASSETS = [
  { id: 'cash',      icon: '💵', name: '现金',       color: '#38bdf8' },
  { id: 'yuebao',    icon: '🐙', name: '余额宝',     color: '#fbbf24' },
  { id: 'wechat',    icon: '💬', name: '微信钱包',   color: '#22c55e' },
  { id: 'gold',      icon: '🥇', name: '黄金',       color: '#f59e0b' },
  { id: 'insurance', icon: '🛡️', name: '保险',       color: '#a78bfa' },
];
const TYPE_ASSETS = [
  { id: 'stock', icon: '📈', name: '股票', color: '#34d399' },
  { id: 'fund',  icon: '💹', name: '基金', color: '#a78bfa' },
];

const STATIC_KEY = 'staticAssets_v2';
const HOLDINGS_KEY = 'assetHoldings';

const DEFAULT_STATIC = {
  cash:      { amount: 50000,  note: '家庭备用金' },
  yuebao:    { amount: 30000,  note: '日常零花' },
  wechat:    { amount: 5000,   note: '零钱通' },
  gold:      { amount: 20000,  note: '实物金/纸黄金' },
  insurance: { amount: 50000,  note: '储蓄型/年金险' },
};

const DEFAULT_HOLDINGS = [
  { type:'stock', code:'600519', qty:100,  note:'贵州茅台',  price:0, prevClose:0, changePct:0, updatedAt:null },
  { type:'stock', code:'000858', qty:1000, note:'五粮液',    price:0, prevClose:0, changePct:0, updatedAt:null },
  { type:'fund',  code:'110022', qty:5000, note:'易方达消费',price:0, prevClose:0, changePct:0, updatedAt:null },
  { type:'fund',  code:'000961', qty:3000, note:'天弘沪深300',price:0, prevClose:0, changePct:0, updatedAt:null },
];

// ── Load Data ────────────────────────────────────────────
// 读取静态资产（内置 + 自定义）
function loadStatic() {
  const raw = localStorage.getItem('staticAssets_v3');
  let allAssets = [];
  try { if (raw) allAssets = JSON.parse(raw); } catch(e) {}

  // 内置资产
  const result = {};
  PLATFORM_ASSETS.forEach(p => {
    const saved = allAssets.find(x => x.id === p.id);
    result[p.id] = { amount: saved ? (saved.amount ?? DEFAULT_STATIC[p.id]?.amount ?? 0) : DEFAULT_STATIC[p.id]?.amount ?? 0,
                     note:   saved ? (saved.note ?? DEFAULT_STATIC[p.id]?.note ?? '')     : DEFAULT_STATIC[p.id]?.note ?? '' };
  });
  // 兼容旧 v2 格式
  const raw2 = localStorage.getItem(STATIC_KEY);
  if (raw2 && !raw) {
    try {
      const saved = JSON.parse(raw2);
      PLATFORM_ASSETS.forEach(p => {
        const s = saved.find(x => x.id === p.id);
        if (s) result[p.id] = { amount: s.amount ?? result[p.id].amount, note: s.note ?? result[p.id].note };
      });
    } catch(e) {}
  }
  return result;
}

// 读取自定义资产（v3新增）
function loadCustomAssets() {
  const raw = localStorage.getItem('staticAssets_v3');
  try {
    if (raw) {
      const all = JSON.parse(raw);
      return all.filter(x => !PLATFORM_ASSETS.find(p => p.id === x.id));
    }
  } catch(e) {}
  return [];
}

function loadHoldings() {
  try {
    let h = JSON.parse(localStorage.getItem(HOLDINGS_KEY) || 'null');
    if (!h || !Array.isArray(h) || !h.length) {
      h = DEFAULT_HOLDINGS.map(x => ({...x}));
      localStorage.setItem(HOLDINGS_KEY, JSON.stringify(h));
    }
    return h.map(x => ({ ...x, qty: x.qty ?? x.shares ?? 0, shares: x.shares ?? x.qty ?? 0 }));
  } catch(e) {
    return DEFAULT_HOLDINGS.map(x => ({...x}));
  }
}

let staticData = loadStatic();
let holdings    = loadHoldings();

function saveStatic()  { localStorage.setItem(STATIC_KEY,     JSON.stringify(PLATFORM_ASSETS.map(p => ({ id: p.id, name: p.name, color: p.color, amount: staticData[p.id].amount, note: staticData[p.id].note })))); }
function saveHoldings(){ localStorage.setItem(HOLDINGS_KEY,   JSON.stringify(holdings)); }

function getHoldingValue(h) {
  const p = h.price > 0 ? h.price : (h.prevClose > 0 ? h.prevClose : 0);
  return p * h.qty;
}

// ── API ──────────────────────────────────────────────────
// ── 修复①：先用搜索API获取正确secid，再取实时价格 ──────
async function fetchStock(code) {
  try {
    // 第一步：搜索API获取正确名称和secid
    const searchUrl = `https://searchapi.eastmoney.com/api/suggest/get?input=${code}&type=14&token=D43BF722C8E33BDC906FB84D85E326E8&count=5&_=${Date.now()}`;
    const searchText = await fetch(searchUrl, { headers: { 'Referer': 'https://www.eastmoney.com' } }).then(r => r.text()).catch(() => null);

    let secid = null;
    let name = code;

    if (searchText) {
      try {
        const searchJson = JSON.parse(searchText);
        const data = searchJson?.QuotationCodeTable?.Data;
        if (data && data.length > 0) {
          const match = data.find(d => d.Code === code) || data.find(d => d.Code.startsWith(code));
          if (match) {
            secid = match.SecuID;
            name = match.Name || match.SecuName || code;
          }
        }
      } catch(e) {}
    }

    // 兜底：按代码规则判断市场
    if (!secid) {
      if (code.startsWith('6') || code.startsWith('688')) secid = `1.${code}`;
      else if (code.startsWith('8')) secid = `0.${code}`;
      else secid = `0.${code}`;
    }

    // 第二步：用secid获取实时价格
    const priceUrl = `https://push2.eastmoney.com/api/qt/stock/get?secid=${secid}&fields=f43,f46,f57,f58,f169,f170&ut=fa5fd1943c7b386f172d6893dbfba10b&cb=cb&_=${Date.now()}`;
    const priceText = await fetch(priceUrl, { headers: { 'Referer': 'https://www.eastmoney.com' } }).then(r => r.text()).catch(() => null);

    if (!priceText) return null;
    const priceMatch = priceText.match(/cb\((.+)\)/);
    if (!priceMatch) return null;
    const priceJson = JSON.parse(priceMatch[1]);
    const d = priceJson.data;
    if (!d) {
      // 尝试另一个市场
      const altSecid = secid.startsWith('1.') ? `0.${code}` : `1.${code}`;
      const retryUrl = `https://push2.eastmoney.com/api/qt/stock/get?secid=${altSecid}&fields=f43,f46,f57,f58,f169,f170&ut=fa5fd1943c7b386f172d6893dbfba10b&cb=cb&_=${Date.now()}`;
      const retryText = await fetch(retryUrl, { headers: { 'Referer': 'https://www.eastmoney.com' } }).then(r => r.text()).catch(() => null);
      if (!retryText) return null;
      const retryMatch = retryText.match(/cb\((.+)\)/);
      if (!retryMatch) return null;
      const retryJson = JSON.parse(retryMatch[1]);
      const d2 = retryJson.data;
      if (!d2) return null;
      return { name: d2.f58 || name, price: d2.f43 ? d2.f43/100 : 0, prev: d2.f169 ? d2.f169/100 : (d2.f46 ? d2.f46/100 : 0), chg: d2.f170 ? d2.f170/100 : 0 };
    }
    if (d.f58) name = d.f58;
    const price = d.f43 ? d.f43/100 : 0;
    const prev  = d.f169 ? d.f169/100 : (d.f46 ? d.f46/100 : 0);
    const chg   = d.f170 ? d.f170/100 : 0;
    return { name, price, prev, chg };
  } catch(e) { return null; }
}

// ── 修复②：基金净值改用东方财富历史净值接口（昨收更准确） ──
async function fetchFund(code) {
  try {
    // 天天基金实时估值：返回 jsonpgz({...})，含名称/估算净值/单位净值
    const url = `https://fundgz.1234567.com.cn/js/${code}.js?rt=${Date.now()}`;
    const text = await fetch(url, { headers: { 'User-Agent': 'Mozilla/5.0' } }).then(r => r.text()).catch(() => null);

    let price = 0, prev = 0, chg = 0, name = code;

    if (text) {
      // 兼容 jsonpgz 和 fundgz 两种格式，API响应末尾有 }); 需兼容
      const inner = text.match(/^(?:jsonpgz|fundgz)\((.+)\)(?:;|$)/);
      if (inner) {
        const d = JSON.parse(inner[1]);
        name = d.name || code;
        price = parseFloat(d.gsz) || 0;
        prev  = parseFloat(d.dwjz) || 0;
        chg   = parseFloat(d.gszzl || d.gszzz) || 0;
      }
    }

    // 兜底：从东方财富获取历史净值（昨收）
    if (!prev) {
      try {
        const histUrl = `https://api.fund.eastmoney.com/f10/lsjz?callback=jQuery&fundCode=${code}&pageIndex=1&pageSize=2&_=${Date.now()}`;
        const histText = await fetch(histUrl, { headers: { 'Referer': 'https://fund.eastmoney.com', 'User-Agent': 'Mozilla/5.0' } }).then(r => r.text()).catch(() => null);
        if (histText) {
          const m = histText.match(/jQuery\((.+)\)/);
          if (m) {
            const j = JSON.parse(m[1]);
            const DS = j?.Data?.LSJZList || j?.Data?.Datas;
            if (DS && DS.length > 0) {
              if (!prev && DS[0].DWJZ) prev = parseFloat(DS[0].DWJZ);
              if (DS.length > 1 && !prev) prev = parseFloat(DS[1].DWJZ);
              if (!name || name === code) name = DS[0].FUNDNAME || code;
            }
          }
        }
      } catch(e) {}
    }

    return { name, price: price > 0 ? price : prev, prev: prev > 0 ? prev : price, chg };
  } catch(e) { return null; }
}

async function refreshPrices() {
  const now = new Date();
  document.getElementById('updateDate').textContent = now.toLocaleDateString('zh-CN');

  for (const h of holdings) {
    if (h.type === 'stock') {
      const r = await fetchStock(h.code);
      if (r) { h.name = r.name; h.price = r.price; h.prevClose = r.prev; h.changePct = r.chg; h.updatedAt = Date.now(); }
    } else {
      const r = await fetchFund(h.code);
      if (r) { h.name = r.name; h.price = r.price; h.prevClose = r.prev; h.changePct = r.chg; h.updatedAt = Date.now(); }
    }
    await new Promise(r => setTimeout(r, 150));
  }
  saveHoldings();
  render();
}

// ── Render ──────────────────────────────────────────────
let charts = {};

function buildData() {
  const stockVal = holdings.filter(h => h.type === 'stock').reduce((s, h) => s + getHoldingValue(h), 0);
  const fundVal  = holdings.filter(h => h.type === 'fund').reduce((s, h) => s + getHoldingValue(h), 0);

  // 内置平台资产
  const platformList = PLATFORM_ASSETS.map(p => ({
    ...p,
    amount: staticData[p.id]?.amount ?? 0,
  }));

  // 自定义静态资产（从v3读取）
  const customList = loadCustomAssets().map(c => ({
    id: c.id, icon: '📦', name: c.name || c.id, color: '#64748B', amount: c.amount || 0
  }));
  const allPlatformList = [...platformList, ...customList];

  const cashVal = (staticData.cash?.amount || 0);
  const yueVal   = (staticData.yuebao?.amount || 0);
  const wxVal    = (staticData.wechat?.amount || 0);
  const typeList = [
    { id:'stock', icon:'📈', name:'股票', color:'#34d399', amount: stockVal },
    { id:'fund',  icon:'💹', name:'基金', color:'#a78bfa', amount: fundVal  },
    { id:'cash',  icon:'💵', name:'现金', color:'#38bdf8', amount: cashVal + yueVal + wxVal },
  ];

  const total = allPlatformList.reduce((s, a) => s + a.amount, 0) + stockVal + fundVal;
  return { total, platformList: allPlatformList, typeList };
}

function renderCard(item, total, prefix) {
  const pct = total > 0 ? ((item.amount / total) * 100).toFixed(1) : '0.0';
  return `
    <div class="asset-card" style="--c:${item.color}">
      <style>.asset-card[style*="--c:${item.color}"]::before{background:${item.color};}</style>
      <div class="asset-card-top">
        <div class="asset-card-icon">${item.icon}</div>
        <div class="asset-card-pct">${pct}%</div>
      </div>
      <div class="asset-card-name">${item.name}</div>
      <div class="asset-card-val" style="color:${item.color}">¥${item.amount.toLocaleString()}</div>
      <div class="asset-card-bar"><div class="asset-card-bar-fill" style="width:${pct}%;background:${item.color};"></div></div>
    </div>
  `;
}

function renderCharts(items, total, pieId, barId, pieKey, barKey) {
  const labels = items.map(i => i.name);
  const values = items.map(i => i.amount);
  const colors = items.map(i => i.color);

  // Pie
  if (charts[pieKey]) { charts[pieKey].destroy(); }
  const pieCtx = document.getElementById(pieId).getContext('2d');
  charts[pieKey] = new Chart(pieCtx, {
    type: 'doughnut',
    data: {
      labels,
      datasets: [{ data: values, backgroundColor: colors, borderWidth: 0, hoverOffset: 6 }]
    },
    options: {
      responsive: true, maintainAspectRatio: false, cutout: '62%',
      plugins: {
        legend: {
          position: 'bottom', labels: { color: '#8fa3bf', padding: 12, font: { size: 12 } }
        },
        tooltip: {
          callbacks: {
            label: ctx => {
              const v = ctx.parsed, p = total > 0 ? ((v / total) * 100).toFixed(1) : '0.0';
              return ` ¥${v.toLocaleString()} (${p}%)`;
            }
          }
        }
      }
    }
  });

  // Bar
  if (charts[barKey]) { charts[barKey].destroy(); }
  const barCtx = document.getElementById(barId).getContext('2d');
  charts[barKey] = new Chart(barCtx, {
    type: 'bar',
    data: {
      labels,
      datasets: [{ label: '金额', data: values, backgroundColor: colors, borderRadius: 6, borderSkipped: false }]
    },
    options: {
      responsive: true, maintainAspectRatio: false, indexAxis: 'y',
      plugins: { legend: { display: false }, tooltip: { callbacks: { label: ctx => ` ¥${ctx.parsed.x.toLocaleString()}` } } },
      scales: {
        x: { grid: { color: 'rgba(255,255,255,0.06)' }, ticks: { color: '#8fa3bf', callback: v => '¥' + v.toLocaleString() } },
        y: { grid: { display: false }, ticks: { color: '#e8edf5', font: { size: 12 } } }
      }
    }
  });
}

function render() {
  const { total, platformList, typeList } = buildData();

  // Hero
  document.getElementById('totalAmount').textContent = '¥ ' + total.toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

  const heroCards = document.getElementById('heroCards');
  const allItems = [...platformList, { id:'stock', icon:'📈', name:'股票', color:'#34d399', amount: holdings.filter(h=>h.type==='stock').reduce((s,h)=>s+getHoldingValue(h),0) }, { id:'fund', icon:'💹', name:'基金', color:'#a78bfa', amount: holdings.filter(h=>h.type==='fund').reduce((s,h)=>s+getHoldingValue(h),0) }];
  heroCards.innerHTML = allItems.filter(i => i.amount > 0).sort((a,b)=>b.amount-a.amount).slice(0,5).map(item => {
    const pct = total > 0 ? ((item.amount / total) * 100).toFixed(1) : '0.0';
    return `<div class="hero-card">
      <div class="hero-card-icon">${item.icon}</div>
      <div class="hero-card-name">${item.name}</div>
      <div class="hero-card-val" style="color:${item.color}">¥${item.amount.toLocaleString()}</div>
      <div class="hero-card-pct">${pct}%</div>
    </div>`;
  }).join('');

  // Platform cards
  const pTotal = platformList.reduce((s,i)=>s+i.amount,0) + typeList.find(t=>t.id==='stock').amount + typeList.find(t=>t.id==='fund').amount;
  document.getElementById('platformCards').innerHTML = platformList.map(p => renderCard(p, pTotal, 'p')).join('');

  // Type cards
  document.getElementById('typeCards').innerHTML = typeList.map(t => renderCard(t, total, 't')).join('');

  // Charts
  renderCharts(platformList, pTotal, 'platformPieChart', 'platformBarChart', 'ppie', 'pbar');
  renderCharts(typeList,     total,    'typePieChart',    'typeBarChart',    'tpie', 'tbar');
}

// ── Init ─────────────────────────────────────────────────
const today = new Date();
document.getElementById('updateDate').textContent = today.toLocaleDateString('zh-CN');
render();
refreshPrices();

// Sync on tab switch
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') {
    staticData = loadStatic();
    holdings    = loadHoldings();
    render();
    refreshPrices();
  }
});
</script>
</body>
