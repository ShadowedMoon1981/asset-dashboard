<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>个人资产管理看板</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --bg-primary: #0f172a;
      --bg-card: #1e293b;
      --bg-card-hover: #273549;
      --text-primary: #f1f5f9;
      --text-secondary: #94a3b8;
      --accent-blue: #38bdf8;
      --accent-green: #4ade80;
      --accent-red: #f87171;
      --accent-yellow: #fbbf24;
      --accent-purple: #c084fc;
      --accent-orange: #fb923c;
      --border: #334155;
      --shadow: rgba(0, 0, 0, 0.4);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      padding: 20px;
    }

    .container { max-width: 1400px; margin: 0 auto; }

    /* Header */
    .header {
      position: relative;
      text-align: center;
      margin-bottom: 40px;
      padding: 30px 20px;
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      border-radius: 20px;
    }
    .header-btn {
      position: absolute;
      top: 20px;
      right: 24px;
      padding: 7px 14px;
      background: rgba(79,70,229,0.15);
      border: 1px solid rgba(79,70,229,0.3);
      border-radius: 8px;
      color: #818CF8;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s;
    }
    .header-btn:hover { background: rgba(79,70,229,0.25); }
      border: 1px solid var(--border);
      position: relative;
      overflow: hidden;
    }
    .header::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--accent-blue), var(--accent-green), var(--accent-yellow), var(--accent-purple));
    }
    .header h1 {
      font-size: 2.2rem;
      font-weight: 700;
      margin-bottom: 8px;
      background: linear-gradient(135deg, var(--accent-blue), var(--accent-green));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .header .date { color: var(--text-secondary); font-size: 1rem; }
    .total-assets {
      margin-top: 20px;
      padding: 25px;
      background: linear-gradient(135deg, rgba(56,189,248,0.12), rgba(74,222,128,0.12));
      border-radius: 16px;
      border: 1px solid rgba(56,189,248,0.25);
    }
    .total-assets .label { font-size: 0.95rem; color: var(--text-secondary); margin-bottom: 5px; }
    .total-assets .amount {
      font-size: 3rem;
      font-weight: 800;
      color: var(--accent-green);
      text-shadow: 0 0 30px rgba(74,222,128,0.3);
    }

    /* Section title */
    .section-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* KPI Cards */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 14px;
      margin-bottom: 30px;
    }
    .kpi-card {
      background: var(--bg-card);
      border-radius: 14px;
      padding: 18px;
      border: 1px solid var(--border);
      transition: all 0.3s ease;
    }
    .kpi-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 30px var(--shadow);
      border-color: var(--accent-blue);
    }
    .kpi-card .icon { font-size: 1.8rem; margin-bottom: 10px; }
    .kpi-card .label { font-size: 0.8rem; color: var(--text-secondary); margin-bottom: 5px; }
    .kpi-card .amount { font-size: 1.35rem; font-weight: 700; }
    .kpi-card .percent { font-size: 0.8rem; color: var(--text-secondary); margin-top: 5px; }

    /* Charts */
    .charts-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(420px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }
    .chart-card {
      background: var(--bg-card);
      border-radius: 16px;
      padding: 22px;
      border: 1px solid var(--border);
    }
    .chart-card h3 {
      font-size: 1rem;
      margin-bottom: 18px;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .chart-container { position: relative; height: 280px; }

    /* Holdings Section */
    .holdings-section {
      background: var(--bg-card);
      border-radius: 16px;
      padding: 22px;
      border: 1px solid var(--border);
      margin-bottom: 30px;
    }
    .holdings-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
      flex-wrap: wrap;
      gap: 12px;
    }
    .holdings-header h3 {
      font-size: 1rem;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .price-status {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 0.8rem;
      color: var(--text-secondary);
    }
    .refresh-btn {
      background: rgba(56,189,248,0.15);
      color: var(--accent-blue);
      border: 1px solid rgba(56,189,248,0.3);
      border-radius: 8px;
      padding: 6px 14px;
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .refresh-btn:hover { background: rgba(56,189,248,0.25); }
    .refresh-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .holdings-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 14px;
    }

    .holding-card {
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      position: relative;
      transition: all 0.2s;
    }
    .holding-card:hover { border-color: var(--accent-blue); background: rgba(255,255,255,0.05); }

    .holding-card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
    }
    .holding-type-badge {
      font-size: 0.7rem;
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: 600;
    }
    .badge-stock { background: rgba(74,222,128,0.2); color: var(--accent-green); }
    .badge-fund { background: rgba(192,132,252,0.2); color: var(--accent-purple); }

    .holding-name {
      font-size: 1rem;
      font-weight: 700;
      margin: 6px 0 4px;
      color: var(--text-primary);
    }
    .holding-code { font-size: 0.75rem; color: var(--text-secondary); }

    .holding-delete {
      background: none;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 1.1rem;
      padding: 2px 6px;
      border-radius: 4px;
      transition: all 0.2s;
    }
    .holding-delete:hover { color: var(--accent-red); background: rgba(248,113,113,0.15); }

    .holding-details {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      font-size: 0.82rem;
    }
    .holding-detail {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .holding-detail .dt-label { color: var(--text-secondary); font-size: 0.75rem; }
    .holding-detail .dt-value { font-weight: 600; }
    .holding-detail .dt-value.positive { color: var(--accent-green); }
    .holding-detail .dt-value.negative { color: var(--accent-red); }
    .holding-detail .dt-value.loading { color: var(--text-secondary); font-size: 0.8rem; }

    .holding-total {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .holding-total-label { font-size: 0.82rem; color: var(--text-secondary); }
    .holding-total-value { font-size: 1.1rem; font-weight: 800; color: var(--accent-green); }

    .price-updated {
      font-size: 0.72rem;
      color: var(--text-secondary);
      text-align: right;
    }

    /* Add Holding Form */
    .add-holding-form {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px dashed var(--border);
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: flex-end;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .form-group label {
      font-size: 0.75rem;
      color: var(--text-secondary);
    }
    .form-group input, .form-group select {
      background: var(--bg-primary);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 12px;
      color: var(--text-primary);
      font-size: 0.88rem;
      outline: none;
      transition: border-color 0.2s;
    }
    .form-group input:focus, .form-group select:focus {
      border-color: var(--accent-blue);
    }
    .form-group input::placeholder { color: var(--text-secondary); opacity: 0.6; }

    .add-btn {
      background: linear-gradient(135deg, var(--accent-blue), #0ea5e9);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 8px 18px;
      cursor: pointer;
      font-size: 0.88rem;
      font-weight: 600;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .add-btn:hover { opacity: 0.9; transform: translateY(-1px); }

    /* Static Assets Section */
    .static-section {
      background: var(--bg-card);
      border-radius: 16px;
      padding: 22px;
      border: 1px solid var(--border);
      margin-bottom: 30px;
    }
    .static-section h3 {
      font-size: 1rem;
      margin-bottom: 16px;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .static-hint {
      font-size: 0.78rem;
      color: var(--text-secondary);
      margin-bottom: 14px;
      padding: 8px 12px;
      background: rgba(56,189,248,0.08);
      border-radius: 8px;
      border-left: 3px solid var(--accent-blue);
    }

    .static-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 10px;
    }
    .static-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      background: rgba(255,255,255,0.03);
      border-radius: 10px;
      border: 1px solid var(--border);
    }
    .static-item .sicon { font-size: 1.4rem; }
    .static-item .sname { font-size: 0.88rem; color: var(--text-secondary); flex: 1; }
    .static-item .samt {
      font-size: 0.95rem;
      font-weight: 700;
      min-width: 90px;
      text-align: right;
    }
    .static-item input {
      background: transparent;
      border: none;
      border-bottom: 1px dashed var(--border);
      color: var(--text-primary);
      font-size: 0.9rem;
      font-weight: 700;
      text-align: right;
      width: 100px;
      padding: 2px 4px;
      outline: none;
      transition: border-color 0.2s;
    }
    .static-item input:focus { border-bottom-color: var(--accent-blue); }
    .static-item input::-webkit-outer-spin-button,
    .static-item input::-webkit-inner-spin-button { -webkit-appearance: none; }

    /* Data Table */
    .table-section {
      background: var(--bg-card);
      border-radius: 16px;
      padding: 22px;
      border: 1px solid var(--border);
      overflow-x: auto;
    }
    .table-section h3 {
      font-size: 1rem;
      margin-bottom: 16px;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    table { width: 100%; border-collapse: collapse; min-width: 580px; }
    th, td { padding: 12px 14px; text-align: left; border-bottom: 1px solid var(--border); }
    th {
      background: rgba(56,189,248,0.08);
      color: var(--accent-blue);
      font-weight: 600;
      font-size: 0.85rem;
    }
    tr:hover { background: var(--bg-card-hover); }
    td { font-size: 0.88rem; }

    .rank {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 26px; height: 26px;
      border-radius: 7px;
      font-weight: 700;
      font-size: 0.8rem;
    }
    .rank-1 { background: linear-gradient(135deg,#fbbf24,#f59e0b); color: #1e293b; }
    .rank-2 { background: linear-gradient(135deg,#94a3b8,#64748b); color: #1e293b; }
    .rank-3 { background: linear-gradient(135deg,#cd7f32,#b87333); color: #1e293b; }
    .rank-default { background: var(--bg-card-hover); color: var(--text-secondary); }

    /* Footer */
    .footer {
      text-align: center;
      margin-top: 28px;
      padding: 18px;
      color: var(--text-secondary);
      font-size: 0.82rem;
    }

    /* Responsive */
    @media (max-width: 768px) {
      body { padding: 12px; }
      .header h1 { font-size: 1.5rem; }
      .total-assets .amount { font-size: 2rem; }
      .charts-grid { grid-template-columns: 1fr; }
      .chart-container { height: 240px; }
      .kpi-grid { grid-template-columns: repeat(2, 1fr); }
      .holdings-grid { grid-template-columns: 1fr; }
      .add-holding-form .form-group { flex: 1; min-width: 120px; }
    }
    @media (max-width: 480px) {
      .kpi-grid { grid-template-columns: 1fr; }
      .static-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="container">

    <!-- Header -->
    <header class="header">
      <a href="holdings-manager.html" class="header-btn">📊 持仓管理</a>
      <h1>💰 个人资产管理看板</h1>
      <p class="date" id="currentDate"></p>
      <div class="total-assets">
        <div class="label">💎 总资产（人民币元）</div>
        <div class="amount" id="totalAssets">¥0</div>
      </div>
    </header>

    <!-- KPI Cards -->
    <div class="kpi-grid" id="kpiGrid"></div>

    <!-- Charts -->
    <div class="charts-grid">
      <div class="chart-card">
        <h3>📊 资产结构分布</h3>
        <div class="chart-container"><canvas id="pieChart"></canvas></div>
      </div>
      <div class="chart-card">
        <h3>📈 各类资产金额对比</h3>
        <div class="chart-container"><canvas id="barChart"></canvas></div>
      </div>
    </div>

    <!-- Holdings Display (Stocks & Funds) -->
    <div class="holdings-section">
      <div class="holdings-header">
        <h3>📈 股票 & 基金 持仓</h3>
        <div class="price-status">
          <span id="priceStatus">⏳ 正在获取实时行情...</span>
          <button class="refresh-btn" id="refreshBtn" onclick="refreshPrices()">🔄 刷新价格</button>
          <a href="holdings-manager.html" class="refresh-btn" style="text-decoration:none;">✏️ 管理持仓</a>
        </div>
      </div>
      <div class="holdings-grid" id="holdingsGrid"></div>
    </div>

    <!-- Static Assets -->
    <div class="static-section">
      <h3>💵 其他资产（手动输入金额）</h3>
      <div class="static-hint">💡 直接修改下方金额，数据自动保存到浏览器；切换页面后回到这里自动同步（金额单位：元）</div>
      <div class="static-grid" id="staticGrid"></div>
    </div>

    <!-- Detail Table -->
    <div class="table-section">
      <h3>📋 资产明细一览</h3>
      <table id="assetTable">
        <thead>
          <tr>
            <th>排名</th><th>资产类别</th><th>金额（元）</th><th>占比</th><th>备注</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

    <div class="footer">
      <p>页面刷新时间：<span id="updateTime"></span></p>
      <p style="margin-top:6px;">📌 股票/基金持仓请在「管理持仓」中维护 · 数据来源：东方财富</p>
    </div>
  </div>

<script>
// ================================================================
// 📌 静态资产配置（黄金、保险等直接输金额的资产）
// ================================================================
const STATIC_ASSETS_KEY = 'staticAssets_v2';
const DEFAULT_STATIC_ASSETS = [
  { id: 'cash',      name: '💵 现金',       color: '#38bdf8', note: '家庭备用金',      amount: 50000  },
  { id: 'yuebao',    name: '🐙 余额宝',     color: '#fbbf24', note: '日常零花',        amount: 30000  },
  { id: 'wechat',   name: '💬 微信钱包',   color: '#22c55e', note: '零钱通',          amount: 5000   },
  { id: 'gold',      name: '🥇 黄金',       color: '#f59e0b', note: '实物金/纸黄金',   amount: 20000  },
  { id: 'insurance', name: '🛡️ 保险',       color: '#a78bfa', note: '储蓄型/年金险',   amount: 50000  },
];

// 从 localStorage 加载，兜底默认值
function loadStaticAssets() {
  try {
    const raw = localStorage.getItem(STATIC_ASSETS_KEY);
    if (raw) {
      const saved = JSON.parse(raw);
      // 合并：保留默认字段但用保存的值
      return DEFAULT_STATIC_ASSETS.map(def => {
        const s = saved.find(x => x.id === def.id);
        return s ? { ...def, amount: s.amount ?? def.amount, note: s.note ?? def.note } : def;
      });
    }
  } catch(e) {}
  return DEFAULT_STATIC_ASSETS.map(a => ({...a}));
}
function saveStaticAssets() {
  localStorage.setItem(STATIC_ASSETS_KEY, JSON.stringify(staticAssets));
}

let staticAssets = loadStaticAssets();

// ================================================================
// 📌 持仓数据（自动计算市值）
//  - type: "stock" | "fund"
//  - code: 交易所代码（6位A股、5位基金）
//  - qty: 持有份数（股数/份额）
//  - note: 备注
// ================================================================
let holdings = JSON.parse(localStorage.getItem('assetHoldings') || 'null');
if (!holdings || !Array.isArray(holdings) || holdings.length === 0) {
  holdings = [
    { type:'stock', code:'600519', qty:100,  note:'贵州茅台',     price:0, totalValue:0, updatedAt:null },
    { type:'stock', code:'000858', qty:1000, note:'五粮液',       price:0, totalValue:0, updatedAt:null },
    { type:'fund',  code:'110022', qty:5000, note:'易方达消费',   price:0, totalValue:0, updatedAt:null },
    { type:'fund',  code:'000961', qty:3000, note:'天弘沪深300',  price:0, totalValue:0, updatedAt:null },
  ];
  saveHoldings();
} else {
  // 兼容旧数据格式：shares → qty
  holdings = holdings.map(h => ({
    ...h,
    qty: h.qty ?? h.shares ?? 0,
    shares: h.shares ?? h.qty ?? 0,
    price: h.price ?? 0,
    totalValue: h.price > 0 ? h.price * (h.qty ?? h.shares ?? 0) : (h.totalValue ?? 0),
    note: h.note ?? '',
    type: h.type ?? 'stock',
    updatedAt: h.lastFetched ?? h.updatedAt ?? null,
  }));
}

let stockTotalValue = 0;
let fundTotalValue = 0;
let charts = {};
let isRefreshing = false;

// ---- Storage ----
function saveHoldings() {
  localStorage.setItem('assetHoldings', JSON.stringify(holdings));
}

// ---- API: 获取单只股票实时价格（东方财富） ----
async function fetchStockPrice(code) {
  // secid: 1=沪市(6开头), 0=深市(0/3开头)
  const secid = code.startsWith('6') ? `1.${code}` : `0.${code}`;
  const url = `https://push2.eastmoney.com/api/qt/stock/get?secid=${secid}&fields=f43,f44,f45,f46,f47,f48,f57,f58,f60,f169,f170&ut=fa5fd1943c7b386f172d6893dbfba10b&cb=jQuery&_=${Date.now()}`;
  const text = await fetch(url).then(r => r.text()).catch(() => null);
  if (!text) return null;
  try {
    const json = JSON.parse(text.replace(/^jQuery\(/, '').replace(/\)$/, ''));
    const d = json.data;
    if (!d) return null;
    // f43=最新价(分), f46=昨收(分), f170=涨跌幅(百分之一%)
    const price = d.f43 ? d.f43 / 100 : (d.f169 ? d.f169 / 100 : 0);
    const prevClose = d.f46 ? d.f46 / 100 : price;
    const changePct = d.f170 ? d.f170 / 100 : 0;
    return { name: d.f58, price, change: changePct, prevClose };
  } catch { return null; }
}

// ---- API: 获取单只基金实时估值（东方财富） ----
async function fetchFundPrice(code) {
  const url = `https://fundgz.1234567.com.cn/js/${code}.js?rt=${Date.now()}`;
  const text = await fetch(url).then(r => r.text()).catch(() => null);
  if (!text) return null;
  try {
    // 格式: fundgz({...})  — 先取括号内所有内容，再解析 JSON
    const inner = text.match(/^fundgz\((.+)\)$/);
    if (!inner) return null;
    const d = JSON.parse(inner[1]);
    // gsz=估算净值, gszzz=估算涨跌幅(%字符串), dwjz=昨日净值(兜底)
    const price = parseFloat(d.gsz);
    const prevClose = parseFloat(d.dwjz) || price;
    const changePct = parseFloat(d.gszzz) || 0;
    return { name: d.name, price: isNaN(price) ? prevClose : price, change: changePct, prevClose };
  } catch { return null; }
}

// ---- 刷新所有持仓价格 ----
async function refreshPrices() {
  if (isRefreshing) return;
  isRefreshing = true;
  const btn = document.getElementById('refreshBtn');
  btn.disabled = true;
  btn.textContent = '⏳ 获取中...';
  document.getElementById('priceStatus').textContent = '⏳ 正在获取实时行情...';

  let stockTotal = 0, fundTotal = 0;
  const updated = [];

  for (let i = 0; i < holdings.length; i++) {
    const h = holdings[i];
    const el = document.querySelector(`[data-holding="${i}"]`);
    if (!el) continue;

    const priceEl   = el.querySelector('.dt-price');
    const changeEl  = el.querySelector('.dt-change');
    const totalEl   = el.querySelector('.holding-total-value');
    const nameEl    = el.querySelector('.holding-name');
    const timeEl    = el.querySelector('.price-updated');
    const typeBadge = el.querySelector('.holding-type-badge');

    try {
      if (h.type === 'stock') {
        const r = await fetchStockPrice(h.code);
        if (r) {
          h.price = r.price; h.totalValue = r.price * h.qty;
          h.name = r.name; h.change = r.change; h.updatedAt = Date.now();
          priceEl.textContent = `¥${r.price.toFixed(2)}`;
          changeEl.textContent = `${r.change >= 0 ? '+' : ''}${r.change.toFixed(2)}%`;
          changeEl.className = `dt-value ${r.change >= 0 ? 'positive' : 'negative'}`;
          nameEl.textContent = r.name || h.code;
          typeBadge.textContent = '📈 股票';
          typeBadge.className = 'holding-type-badge badge-stock';
          totalEl.textContent = `¥${h.totalValue.toLocaleString('zh-CN', {minimumFractionDigits:2,maximumFractionDigits:2})}`;
          stockTotal += h.totalValue;
        } else {
          priceEl.textContent = '获取失败'; priceEl.className = 'dt-value negative';
        }
      } else {
        const r = await fetchFundPrice(h.code);
        if (r) {
          h.price = r.price; h.totalValue = r.price * h.qty;
          h.name = r.name; h.change = r.change; h.updatedAt = Date.now();
          priceEl.textContent = `¥${r.price.toFixed(4)}`;
          changeEl.textContent = `${r.change >= 0 ? '+' : ''}${r.change.toFixed(2)}%`;
          changeEl.className = `dt-value ${r.change >= 0 ? 'positive' : 'negative'}`;
          nameEl.textContent = r.name || h.code;
          typeBadge.textContent = '💹 基金';
          typeBadge.className = 'holding-type-badge badge-fund';
          totalEl.textContent = `¥${h.totalValue.toLocaleString('zh-CN', {minimumFractionDigits:2,maximumFractionDigits:2})}`;
          fundTotal += h.totalValue;
        } else {
          priceEl.textContent = '获取失败'; priceEl.className = 'dt-value negative';
        }
      }
      const now = new Date();
      timeEl.textContent = `更新: ${now.toLocaleTimeString('zh-CN')}`;
    } catch (e) {
      priceEl.textContent = '超时'; priceEl.className = 'dt-value negative';
    }
    updated.push(h);
  }

  holdings = updated;
  saveHoldings();
  stockTotalValue = stockTotal;
  fundTotalValue = fundTotal;

  document.getElementById('priceStatus').textContent = `✅ 股票 ¥${stockTotal.toLocaleString()} · 基金 ¥${fundTotal.toLocaleString()} · 更新于 ${new Date().toLocaleTimeString('zh-CN')}`;
  btn.disabled = false;
  btn.textContent = '🔄 刷新价格';
  isRefreshing = false;
  renderAll();
}

// ---- 添加持仓 ----
function addHolding() {
  const type = document.getElementById('typeSelect').value;
  const code = document.getElementById('codeInput').value.trim();
  const qty  = parseInt(document.getElementById('qtyInput').value);
  const note = document.getElementById('noteInput').value.trim();

  if (!code || !/^\d{5,6}$/.test(code)) {
    alert('请输入正确的6位股票代码或5位基金代码');
    return;
  }
  if (!qty || qty <= 0) {
    alert('请输入有效的持有份数');
    return;
  }

  holdings.push({ type, code, qty, note, price:0, totalValue:0, updatedAt:null, name: note || code });
  saveHoldings();
  document.getElementById('codeInput').value = '';
  document.getElementById('qtyInput').value = '';
  document.getElementById('noteInput').value = '';
  renderHoldings();
  refreshPrices();
}

// ---- 删除持仓 ----
function deleteHolding(index) {
  holdings.splice(index, 1);
  saveHoldings();
  renderHoldings();
  refreshPrices();
}

// ---- 渲染持仓卡片 ----
function renderHoldings() {
  const grid = document.getElementById('holdingsGrid');
  grid.innerHTML = '';
  holdings.forEach((h, i) => {
    const isStock = h.type === 'stock';
    const changeText = h.change != null ? `${h.change >= 0 ? '+' : ''}${h.change.toFixed(2)}%` : '--';
    const changeClass = h.change != null ? (h.change >= 0 ? 'positive' : 'negative') : '';
    const priceText = h.price > 0 ? (isStock ? `¥${h.price.toFixed(2)}` : `¥${h.price.toFixed(4)}`) : '加载中...';
    const totalText = h.totalValue > 0 ? `¥${h.totalValue.toLocaleString('zh-CN', {minimumFractionDigits:2,maximumFractionDigits:2})}` : '--';
    const updatedText = h.updatedAt ? `更新: ${new Date(h.updatedAt).toLocaleTimeString('zh-CN')}` : '等待获取';
    const badge = isStock ? '📈 股票' : '💹 基金';
    const badgeClass = isStock ? 'badge-stock' : 'badge-fund';

    const card = document.createElement('div');
    card.className = 'holding-card';
    card.setAttribute('data-holding', i);
    card.innerHTML = `
      <div class="holding-card-header">
        <div>
          <span class="holding-type-badge ${badgeClass}">${badge}</span>
          <div class="holding-name">${h.name || h.code}</div>
          <div class="holding-code">${h.code}</div>
        </div>
        <button class="holding-delete" onclick="deleteHolding(${i})" title="删除">✕</button>
      </div>
      <div class="holding-details">
        <div class="holding-detail">
          <span class="dt-label">最新价</span>
          <span class="dt-value ${h.price > 0 ? '' : 'loading'}">${priceText}</span>
        </div>
        <div class="holding-detail">
          <span class="dt-label">涨跌幅</span>
          <span class="dt-value ${changeClass}">${changeText}</span>
        </div>
        <div class="holding-detail">
          <span class="dt-label">持有份数</span>
          <span class="dt-value">${h.qty.toLocaleString()}${isStock ? ' 股' : ' 份'}</span>
        </div>
        <div class="holding-detail">
          <span class="dt-label">成本/净值</span>
          <span class="dt-value loading">${h.note || '--'}</span>
        </div>
      </div>
      <div class="holding-total">
        <span class="holding-total-label">持仓市值</span>
        <span class="holding-total-value">${totalText}</span>
      </div>
      <div class="price-updated">${updatedText}</div>
    `;
    grid.appendChild(card);
  });
}

// ---- 渲染静态资产输入 ----
function renderStaticInputs() {
  const grid = document.getElementById('staticGrid');
  grid.innerHTML = '';
  staticAssets.forEach(asset => {
    const item = document.createElement('div');
    item.className = 'static-item';
    item.innerHTML = `
      <span class="sicon">${asset.name.split(' ')[0]}</span>
      <span class="sname">${asset.name.split(' ')[1]}</span>
      <input type="number" value="${asset.amount}"
        style="color: ${asset.color}"
        oninput="updateStaticAmount('${asset.id}', this.value)"
        min="0" step="1" />
    `;
    grid.appendChild(item);
  });
}

function updateStaticAmount(id, val) {
  const asset = staticAssets.find(a => a.id === id);
  if (asset) { asset.amount = parseFloat(val) || 0; saveStaticAssets(); renderAll(); }
}

// ---- 汇总所有资产 ----
function getAllAssets() {
  return [
    ...staticAssets.map(a => ({ name: a.name, amount: a.amount, color: a.color, note: a.note })),
    { name: '📈 股票', amount: stockTotalValue, color: '#4ade80', note: '实时市值（自动）' },
    { name: '💹 基金', amount: fundTotalValue,  color: '#c084fc', note: '实时估值（自动）' },
  ];
}

// ---- 渲染全部 ----
function renderAll() {
  const allAssets = getAllAssets();
  const total = allAssets.reduce((s, a) => s + a.amount, 0);
  const sorted = [...allAssets].sort((a, b) => b.amount - a.amount);

  // Header total
  document.getElementById('totalAssets').textContent = '¥' + total.toLocaleString();

  // KPI cards
  const kpiGrid = document.getElementById('kpiGrid');
  kpiGrid.innerHTML = '';
  sorted.forEach(asset => {
    if (asset.amount <= 0) return;
    const pct = ((asset.amount / total) * 100).toFixed(1);
    const card = document.createElement('div');
    card.className = 'kpi-card';
    card.innerHTML = `
      <div class="icon">${asset.name.split(' ')[0]}</div>
      <div class="label">${asset.name.split(' ')[1]}</div>
      <div class="amount" style="color:${asset.color}">¥${asset.amount.toLocaleString()}</div>
      <div class="percent">占比 ${pct}%</div>
    `;
    kpiGrid.appendChild(card);
  });

  // Charts
  renderCharts(sorted, total);

  // Table
  const tbody = document.querySelector('#assetTable tbody');
  tbody.innerHTML = '';
  sorted.forEach((asset, i) => {
    if (asset.amount <= 0) return;
    const rank = i + 1;
    const rankClass = rank===1?'rank-1':rank===2?'rank-2':rank===3?'rank-3':'rank-default';
    const pct = ((asset.amount / total)*100).toFixed(1);
    const row = document.createElement('tr');
    row.innerHTML = `
      <td><span class="rank ${rankClass}">${rank}</span></td>
      <td><strong>${asset.name}</strong></td>
      <td style="color:${asset.color};font-weight:600;">¥${asset.amount.toLocaleString()}</td>
      <td>
        <div style="display:flex;align-items:center;gap:10px;">
          <div style="flex:1;background:var(--bg-card-hover);border-radius:4px;height:8px;overflow:hidden;">
            <div style="width:${pct}%;height:100%;background:${asset.color};border-radius:4px;"></div>
          </div>
          <span style="min-width:45px;">${pct}%</span>
        </div>
      </td>
      <td style="color:var(--text-secondary);">${asset.note}</td>
    `;
    tbody.appendChild(row);
  });
}

// ---- 渲染图表（更新而非重建） ----
function renderCharts(sorted, total) {
  const labels = sorted.filter(a=>a.amount>0).map(a=>a.name.split(' ')[1]);
  const values = sorted.filter(a=>a.amount>0).map(a=>a.amount);
  const colors = sorted.filter(a=>a.amount>0).map(a=>a.color);

  if (charts.pie) {
    charts.pie.data.labels = labels;
    charts.pie.data.datasets[0].data = values;
    charts.pie.data.datasets[0].backgroundColor = colors;
    charts.pie.update();
  } else {
    const pieCtx = document.getElementById('pieChart').getContext('2d');
    charts.pie = new Chart(pieCtx, {
      type: 'doughnut',
      data: { labels, datasets:[{ data: values, backgroundColor: colors, borderWidth:0, hoverOffset:10 }] },
      options: { responsive:true, maintainAspectRatio:false, cutout:'60%',
        plugins:{ legend:{ position:'right', labels:{ color:'#f1f5f9', padding:14, font:{size:13} } },
          tooltip:{ callbacks:{ label:ctx=>{ const v=ctx.parsed, p=((v/total)*100).toFixed(1); return ` ¥${v.toLocaleString()} (${p}%)`; } } } }
    });
  }

  if (charts.bar) {
    charts.bar.data.labels = labels;
    charts.bar.data.datasets[0].data = values;
    charts.bar.data.datasets[0].backgroundColor = colors;
    charts.bar.update();
  } else {
    const barCtx = document.getElementById('barChart').getContext('2d');
    charts.bar = new Chart(barCtx, {
      type: 'bar',
      data: { labels, datasets:[{ label:'金额（元）', data: values, backgroundColor: colors, borderRadius:8, borderSkipped:false }] },
      options: { responsive:true, maintainAspectRatio:false, indexAxis:'y',
        plugins:{ legend:{display:false}, tooltip:{ callbacks:{ label:ctx=>` ¥${ctx.parsed.x.toLocaleString()}` } } },
        scales:{ x:{ grid:{color:'rgba(255,255,255,0.08)'}, ticks:{ color:'#94a3b8', callback:v=>'¥'+v.toLocaleString() } },
                 y:{ grid:{display:false}, ticks:{color:'#f1f5f9',font:{size:12}} } }
      }
    });
  }
}

// ---- Init ----
const now = new Date();
document.getElementById('currentDate').textContent = now.toLocaleDateString('zh-CN',{year:'numeric',month:'long',day:'numeric',weekday:'long'});
document.getElementById('updateTime').textContent = now.toLocaleString('zh-CN');

renderStaticInputs();
renderHoldings();
renderAll();
refreshPrices();

// ── 回到此页面时自动刷新（持仓管理页修改后回来立即同步）────────
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') {
    staticAssets = loadStaticAssets();       // 重读静态资产
    const rawHoldings = localStorage.getItem('assetHoldings');
    if (rawHoldings) {
      holdings = JSON.parse(rawHoldings);
    }
    renderStaticInputs();
    renderHoldings();
    renderAll();
    refreshPrices();
  }
});
</script>
</body>
</html>
